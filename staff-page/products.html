<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="../images/favicon.ico?v=3" sizes="any" />
    <link rel="apple-touch-icon" href="../images/apple-touch-icon.png?v=3" />
    <title>Products | UCN-FMRC Staff</title>
    <link rel="stylesheet" href="../admin-page/dashboard.css?v=5.1" />
    <link rel="stylesheet" href="../admin-page/admin-modules.css?v=5.2" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
  </head>
  <body>
    <div class="dashboard-container">
      <aside class="sidebar">
        <div class="sidebar-header">
          <img src="../images/FMRC Logo.png" alt="FMRC Logo" class="logo" />
          <h2>UCN-FMRC</h2>
        </div>
        <nav class="sidebar-nav">
          <a href="dashboard.html" class="nav-link"
            ><i class="fa-solid fa-house"></i> Dashboard</a
          >
          <a href="inventory.html" class="nav-link"
            ><i class="fa-solid fa-box"></i> Inventory</a
          >
          <a href="products.html" class="nav-link active"
            ><i class="fa-solid fa-tags"></i> Products</a
          >
          <a href="promotions.html" class="nav-link" title="Promotions &amp; Announcements"
            ><i class="fa-solid fa-bullhorn"></i> Promotions</a
          >
          <a href="appointments.html" class="nav-link"
            ><i class="fa-regular fa-calendar-check"></i> Appointment</a
          >
          <a href="reports.html" class="nav-link"
            ><i class="fa-solid fa-chart-line"></i> Reports</a
          >
          <a href="orders.html" class="nav-link"
            ><i class="fa-solid fa-box-open"></i> Orders</a
          >
          <a href="customer-inquiries.html" class="nav-link"><i class="fa-regular fa-envelope-open"></i> Customer Inquiries</a>
          <a href="ratings.html" class="nav-link"><i class="fa-solid fa-star"></i> Ratings &amp; Feedback</a>

          <div class="nav-item has-dropdown">
            <a href="#" class="nav-link dropdown-toggle" id="staffControlBtn">
              <div class="dropdown-title">
                <i class="fa-solid fa-screwdriver-wrench"></i> Website
                Management
              </div>
              <i class="fa-solid fa-chevron-down arrow"></i>
            </a>
            <div class="dropdown-menu">
              <a href="website-home.html" class="sub-link">Home</a>
              <a href="website-services.html" class="sub-link">Services</a>
              <a href="website-contact.html" class="sub-link">Contact</a>
              <a href="website-footer.html" class="sub-link">Footer</a>
            </div>
          </div>

          <a href="archives.html" class="nav-link"
            ><i class="fa-solid fa-box-archive"></i> Archives</a
          >
          <a href="my-account.html" class="nav-link"
            ><i class="fa-regular fa-id-card"></i> My Account</a
          >
        </nav>
        <div class="sidebar-footer">
          <button class="logout-btn">
            <i class="fa-solid fa-right-from-bracket"></i> Logout
          </button>
        </div>
      </aside>

      <main class="main-content">
        <header class="top-header">
          <div class="header-left"><h1>Products</h1></div>
          <div class="header-right">
            <div class="notifications" id="notifBell">
              <i class="fa-regular fa-bell"></i
              ><span class="badge" id="notifBadge" style="display: none"></span>
            </div>
            <div class="user-profile">
              <div class="user-info"><span class="role">Staff</span></div>
              <span
                class="profile-icon profile-initial"
                data-email="staff@cnsc.edu.ph"
              ></span>
              <div class="profile-popup" id="profilePopup">
                <div class="popup-header">
                  <div class="popup-profile-row">
                    <span
                      class="popup-profile-icon profile-initial"
                      data-email="staff@cnsc.edu.ph"
                    ></span>
                    <div class="popup-profile-meta">
                      <p class="popup-identity">staff@cnsc.edu.ph</p>
                      <span class="popup-role">Staff</span>
                    </div>
                  </div>
                </div>
                <a href="my-account.html" class="profile-popup-link"
                  ><i class="fa-regular fa-id-card"></i> My Account</a
                >
                <hr />
                <button class="logout-btn popup-logout">
                  <i class="fa-solid fa-right-from-bracket"></i> Logout
                </button>
              </div>
            </div>
          </div>
        </header>

        <section class="module-content" id="staffProductsModule">
          <div
            id="staffProductsLoading"
            class="admin-products-bootstrap-skeleton"
            role="status"
          >
            <span class="admin-loading-sr-only">Loading product management</span>
            <div class="admin-global-skeleton-panel">
              <span class="admin-global-skeleton-bar is-panel-title"></span>
              <div class="admin-global-skeleton-table-row">
                <span class="admin-global-skeleton-bar" style="width: 28px"></span>
                <span class="admin-global-skeleton-bar" style="width: 120px"></span>
                <span class="admin-global-skeleton-bar" style="width: 100px"></span>
                <span class="admin-global-skeleton-bar" style="width: 70px"></span>
                <span class="admin-global-skeleton-bar" style="width: 60px"></span>
              </div>
              <div class="admin-global-skeleton-table-row">
                <span class="admin-global-skeleton-bar" style="width: 28px"></span>
                <span class="admin-global-skeleton-bar" style="width: 120px"></span>
                <span class="admin-global-skeleton-bar" style="width: 100px"></span>
                <span class="admin-global-skeleton-bar" style="width: 70px"></span>
                <span class="admin-global-skeleton-bar" style="width: 60px"></span>
              </div>
              <div class="admin-global-skeleton-table-row">
                <span class="admin-global-skeleton-bar" style="width: 28px"></span>
                <span class="admin-global-skeleton-bar" style="width: 120px"></span>
                <span class="admin-global-skeleton-bar" style="width: 100px"></span>
                <span class="admin-global-skeleton-bar" style="width: 70px"></span>
                <span class="admin-global-skeleton-bar" style="width: 60px"></span>
              </div>
            </div>
          </div>
        </section>
      </main>
    </div>

    <script src="../admin-page/session-helper.js"></script>
    <script src="../admin-page/admin-common.js?v=5.1"></script>
    <script src="products-loader.js?v=5.1"></script>
  </body>
</html>
