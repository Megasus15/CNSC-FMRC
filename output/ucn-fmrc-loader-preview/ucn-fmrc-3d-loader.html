<div id="ucn-fmrc-loader-preview" aria-label="UCN-FMRC 3D loading animation preview">
  <style>
    #ucn-fmrc-loader-preview {
      --fmrc-preview-paper: #fdfaf6;
      --fmrc-preview-ink: #382c2a;
      --fmrc-preview-muted: #76665e;
      --fmrc-preview-wine: #6b202b;
      --fmrc-preview-gold: #bc9149;
      --fmrc-preview-cycle: 4.8s;
      --fmrc-preview-tilt: 24deg;
      color-scheme: light dark;
      width: 100%;
      font-family: "Montserrat", "Segoe UI", sans-serif;
      color: var(--fmrc-preview-ink);
    }
    #ucn-fmrc-loader-preview,
    #ucn-fmrc-loader-preview * { box-sizing: border-box; }
    #ucn-fmrc-loader-preview .fmrc-preview-stage {
      color-scheme: light;
      position: relative;
      display: grid;
      place-items: center;
      min-height: 490px;
      padding: 34px 20px 44px;
      overflow: hidden;
      isolation: isolate;
      border-radius: 18px;
      background:
        radial-gradient(ellipse at 50% 38%, #fffdf8 0%, #fffdf800 56%),
        radial-gradient(ellipse at 12% 100%, #d8b87317, #d8b87300 60%),
        var(--fmrc-preview-paper);
    }
    #ucn-fmrc-loader-preview .fmrc-preview-center {
      display: flex;
      align-items: center;
      flex-direction: column;
      width: min(100%, 340px);
    }
    #ucn-fmrc-loader-preview .fmrc-preview-scene {
      --seal-size: 154px;
      position: relative;
      width: 280px;
      height: 270px;
      perspective: 850px;
    }
    #ucn-fmrc-loader-preview .fmrc-preview-shadow {
      position: absolute;
      left: 70px;
      bottom: 25px;
      width: 140px;
      height: 19px;
      border-radius: 50%;
      background: radial-gradient(ellipse, #66452d36 0%, #66452d12 46%, #66452d00 73%);
      transform: scaleX(0.92);
      animation: fmrcPreviewShadow var(--fmrc-preview-cycle) ease-in-out infinite;
    }
    #ucn-fmrc-loader-preview .fmrc-preview-float {
      position: absolute;
      inset: 0;
      transform-style: preserve-3d;
      animation: fmrcPreviewFloat var(--fmrc-preview-cycle) ease-in-out infinite;
    }
    #ucn-fmrc-loader-preview .fmrc-preview-assembly {
      position: absolute;
      top: 39px;
      left: 63px;
      width: var(--seal-size);
      height: var(--seal-size);
      transform-style: preserve-3d;
      transform: rotateX(12deg) rotateY(-24deg) rotateZ(-5deg);
      animation: fmrcPreviewTilt var(--fmrc-preview-cycle) ease-in-out infinite;
    }
    #ucn-fmrc-loader-preview .fmrc-preview-edge,
    #ucn-fmrc-loader-preview .fmrc-preview-face {
      position: absolute;
      inset: 0;
      border-radius: 50%;
    }
    #ucn-fmrc-loader-preview .fmrc-preview-edge {
      transform: translateZ(calc(var(--layer) * 1px));
      background: linear-gradient(130deg, #eed6a0 2%, #c7a366 24%, #86612e 48%, #d6b97d 72%, #72502c 100%);
      border: 1px solid #9e773d;
    }
    #ucn-fmrc-loader-preview .fmrc-preview-face {
      display: grid;
      place-items: center;
      padding: 6px;
      transform: translateZ(8px);
      backface-visibility: hidden;
      overflow: hidden;
      background: linear-gradient(140deg, #fbebc5 0%, #c59b53 27%, #8b602d 52%, #e5cc93 77%, #ae803e 100%);
      box-shadow: inset 0 0 0 1px #f9e5b4;
    }
    #ucn-fmrc-loader-preview .fmrc-preview-face::after {
      content: "";
      position: absolute;
      inset: -25%;
      background: linear-gradient(110deg, #fff7e900 31%, #fff7e914 42%, #fff7e970 49%, #fff7e914 55%, #fff7e900 66%);
      transform: translateX(-110%);
      animation: fmrcPreviewLight var(--fmrc-preview-cycle) ease-in-out infinite;
      pointer-events: none;
    }
    #ucn-fmrc-loader-preview .fmrc-preview-logo-bed {
      display: grid;
      place-items: center;
      width: 100%;
      height: 100%;
      padding: 4px;
      border-radius: 50%;
      background: #fdfaf6;
      box-shadow: inset 0 0 0 1px #79533338;
    }
    #ucn-fmrc-loader-preview .fmrc-preview-logo {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      border-radius: 50%;
    }
    #ucn-fmrc-loader-preview .fmrc-preview-orbit {
      position: absolute;
      inset: -25px;
      border-radius: 50%;
      border: 1px solid #b38b4930;
      transform: translateZ(3px);
      transform-style: preserve-3d;
    }
    #ucn-fmrc-loader-preview .fmrc-preview-orbit-track {
      position: absolute;
      inset: -2px;
      border-radius: 50%;
      animation: fmrcPreviewOrbit 2.6s linear infinite;
    }
    #ucn-fmrc-loader-preview .fmrc-preview-orbit-track::before {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: 50%;
      background: conic-gradient(from 0deg, #b38b4900 0deg, #b38b4900 175deg, #bc914946 228deg, #a87933 305deg, #e0bd7c 349deg, #b38b4900 350deg);
      -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 2px), #000 calc(100% - 1.5px));
      mask: radial-gradient(farthest-side, transparent calc(100% - 2px), #000 calc(100% - 1.5px));
    }
    #ucn-fmrc-loader-preview .fmrc-preview-orbit-track::after {
      content: "";
      position: absolute;
      width: 5px;
      height: 5px;
      top: -1px;
      left: calc(50% - 2.5px);
      border-radius: 50%;
      background: #b28a44;
      box-shadow: 0 0 9px #d5b36970;
    }
    #ucn-fmrc-loader-preview .fmrc-preview-satellite {
      position: absolute;
      inset: -44px;
      border: 1px solid #6b202b16;
      border-radius: 50%;
      transform: rotateX(62deg) rotateY(-12deg) translateZ(-4px);
      transform-style: preserve-3d;
    }
    #ucn-fmrc-loader-preview .fmrc-preview-satellite > span {
      position: absolute;
      inset: -1px;
      border-radius: 50%;
      animation: fmrcPreviewOrbit 5.2s linear infinite reverse;
    }
    #ucn-fmrc-loader-preview .fmrc-preview-satellite > span::before {
      content: "";
      position: absolute;
      top: 0;
      left: 50%;
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: #6b202b8c;
    }
    #ucn-fmrc-loader-preview .fmrc-preview-brand {
      margin: 0;
      font-size: 21px;
      font-weight: 500;
      line-height: 1.35;
      letter-spacing: 0.17em;
      padding-left: 0.17em;
      color: var(--fmrc-preview-wine);
    }
    #ucn-fmrc-loader-preview .fmrc-preview-name {
      margin: 9px 0 0;
      max-width: 290px;
      color: var(--fmrc-preview-muted);
      font-size: 11px;
      font-weight: 400;
      line-height: 1.7;
      letter-spacing: 0.04em;
      text-align: center;
    }
    #ucn-fmrc-loader-preview .fmrc-preview-status {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      margin-top: 28px;
    }
    #ucn-fmrc-loader-preview .fmrc-preview-caption {
      margin: 0;
      font-size: 12px;
      font-weight: 400;
      line-height: 1.5;
      color: var(--fmrc-preview-muted);
    }
    #ucn-fmrc-loader-preview .fmrc-preview-rail {
      position: relative;
      width: 104px;
      height: 2px;
      border-radius: 2px;
      overflow: hidden;
      background: #6b202b12;
    }
    #ucn-fmrc-loader-preview .fmrc-preview-rail > span {
      position: absolute;
      inset: 0;
      border-radius: inherit;
      background: linear-gradient(90deg, #6b202b00, #6b202b 45%, #bd944c 70%, #bd944c00);
      transform: translateX(-100%);
      animation: fmrcPreviewRail 2s cubic-bezier(.4, 0, .2, 1) infinite;
    }
    #ucn-fmrc-loader-preview .fmrc-preview-controls {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-top: 10px;
      padding: 0 2px;
      color: light-dark(#76665e, #c8b9b0);
      font-size: 12px;
      line-height: 1.5;
    }
    #ucn-fmrc-loader-preview .fmrc-preview-control {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 44px;
      padding: 6px 12px;
      font-family: inherit;
      font-size: 12px;
      font-weight: 500;
      line-height: 1.5;
      border: 1px solid light-dark(#d7cbc0, #6b5c53);
      border-radius: 7px;
      background: light-dark(#fdfaf6, #302823);
      color: light-dark(#6b202b, #eadbd0);
      cursor: pointer;
    }
    #ucn-fmrc-loader-preview .fmrc-preview-control:hover {
      background: light-dark(#f3ece4, #3e342c);
    }
    #ucn-fmrc-loader-preview[data-paused="true"] *,
    #ucn-fmrc-loader-preview[data-paused="true"] *::before,
    #ucn-fmrc-loader-preview[data-paused="true"] *::after {
      animation-play-state: paused !important;
    }
    @keyframes fmrcPreviewFloat {
      0%, 100% { transform: translate3d(0, 4px, 0); }
      50% { transform: translate3d(0, -7px, 0); }
    }
    @keyframes fmrcPreviewTilt {
      0%, 100% { transform: rotateX(12deg) rotateY(calc(-1 * var(--fmrc-preview-tilt))) rotateZ(-5deg); }
      50% { transform: rotateX(18deg) rotateY(var(--fmrc-preview-tilt)) rotateZ(5deg); }
    }
    @keyframes fmrcPreviewShadow {
      0%, 100% { transform: scaleX(1); opacity: 0.85; }
      50% { transform: scaleX(0.77); opacity: 0.48; }
    }
    @keyframes fmrcPreviewLight {
      0%, 8% { transform: translateX(-110%); opacity: 0; }
      18% { opacity: 0.7; }
      48% { transform: translateX(110%); opacity: 0; }
      100% { transform: translateX(110%); opacity: 0; }
    }
    @keyframes fmrcPreviewOrbit { to { transform: rotateZ(360deg); } }
    @keyframes fmrcPreviewRail {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(100%); }
    }
    @media (max-width: 420px) {
      #ucn-fmrc-loader-preview .fmrc-preview-stage { min-height: 445px; padding: 20px 12px 32px; }
      #ucn-fmrc-loader-preview .fmrc-preview-scene { width: 280px; height: 245px; }
      #ucn-fmrc-loader-preview .fmrc-preview-shadow { bottom: 8px; }
      #ucn-fmrc-loader-preview .fmrc-preview-brand { font-size: 19px; }
    }
    @media (prefers-reduced-motion: reduce) {
      #ucn-fmrc-loader-preview *,
      #ucn-fmrc-loader-preview *::before,
      #ucn-fmrc-loader-preview *::after { animation: none !important; }
      #ucn-fmrc-loader-preview .fmrc-preview-assembly { transform: rotateX(8deg) rotateY(-12deg); }
      #ucn-fmrc-loader-preview .fmrc-preview-rail > span { transform: scaleX(0.4); }
    }
  </style>

  <div class="fmrc-preview-controls">
    <span class="fmrc-preview-playback-label">Animation preview</span>
    <button type="button" class="fmrc-preview-control" aria-pressed="false">Pause animation</button>
  </div>
  <script>
    (() => {
      const root = document.getElementById('ucn-fmrc-loader-preview');
      const button = root.querySelector('.fmrc-preview-control');
      const label = root.querySelector('.fmrc-preview-playback-label');
      const preference = window.matchMedia('(prefers-reduced-motion: reduce)');
      const state = { playing: true, tilt: 24, duration: 4.8 };
      function render() {
        root.dataset.paused = String(!state.playing);
        root.style.setProperty('--fmrc-preview-tilt', state.tilt + 'deg');
        root.style.setProperty('--fmrc-preview-cycle', state.duration + 's');
        button.textContent = state.playing ? 'Pause animation' : 'Play animation';
        button.setAttribute('aria-pressed', String(!state.playing));
        button.hidden = preference.matches;
        label.textContent = preference.matches ? 'Reduced motion preview' : 'Animation preview';
      }
      button.addEventListener('click', () => { state.playing = !state.playing; render(); });
      preference.addEventListener('change', render);
      render();
      if (globalThis.Tweak) {
        const tweak = new globalThis.Tweak({ container: root, onChange: render });
        tweak.addSlider(state, 'tilt', { label: '3D tilt', min: 8, max: 38, step: 2, unit: '°' });
        tweak.addSlider(state, 'duration', { label: 'Float cycle', min: 3.2, max: 7.2, step: 0.4, unit: 's' });
      }
    })();
  </script>
