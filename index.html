<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- Unchanged, and deliberately so: `0` is what makes this splash's visible
         length equal to real network time. The browser starts fetching
         home-page/main immediately and keeps this document on screen until that
         one is ready to paint. Nothing here waits, counts or predicts. -->
    <meta http-equiv="refresh" content="0; url=home-page/main">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Same value main.html:11 sets, so the phone's address bar does not
         change colour across the handoff. -->
    <meta name="theme-color" content="#6b202b" />
    <link rel="icon" href="/images/favicon.ico?v=3" sizes="any" />
    <link rel="apple-touch-icon" href="/images/apple-touch-icon.png?v=3" />
    <title>UCN FabManLab - CNSC Fabrication and Manufacturing Resource Center</title>
    <meta name="description" content="CNSC Fabrication and Manufacturing Resource Center - Products, Services, and More">
    <!-- The redirect splash shares the same logo animation as customer pages. -->
    <link rel="preload" as="image" href="images/FMRC%20Logo.png">
    <link rel="stylesheet" href="home-page/fmrc-loader.css?v=2.0">
    <style>
      *, *::before, *::after { box-sizing: border-box; }
      html, body { min-height: 100%; }
      body {
        margin: 0;
        min-height: 100vh;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 24px;
        background:
          radial-gradient(circle at 9% 0%, rgba(241, 237, 18, 0.12), transparent 23rem),
          radial-gradient(circle at 92% 12%, rgba(176, 28, 28, 0.09), transparent 22rem),
          #fffdf9;
        font-family: "Montserrat", "Segoe UI", system-ui, -apple-system, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      /* Paint immediately while the destination starts loading. */
      .fmrc-load-core { animation: none; }
      .fmrc-load-manual {
        margin: 12px 0 0;
        color: #8a6a55;
        font-size: 12px;
        font-weight: 500;
        line-height: 1.45;
      }
      .fmrc-load-manual a {
        color: #6b202b;
        font-weight: 700;
        text-decoration: underline;
        text-underline-offset: 2px;
      }
      .fmrc-load-manual a:hover { color: #501822; }
      .fmrc-load-manual a:active { color: #42151d; }
    </style>
</head>
<body>
    <main class="fmrc-load-core" role="status" aria-live="polite">
      <div class="fmrc-load-mark" aria-hidden="true">
        <span class="fmrc-load-shadow"></span>
        <span class="fmrc-load-float">
          <span class="fmrc-load-assembly">
            <span class="fmrc-load-satellite"><span></span></span>
            <span class="fmrc-load-orbit"><span class="fmrc-load-orbit-track"></span></span>
            <span class="fmrc-load-edge" style="--layer:-7"></span>
            <span class="fmrc-load-edge" style="--layer:-6"></span>
            <span class="fmrc-load-edge" style="--layer:-5"></span>
            <span class="fmrc-load-edge" style="--layer:-4"></span>
            <span class="fmrc-load-edge" style="--layer:-3"></span>
            <span class="fmrc-load-edge" style="--layer:-2"></span>
            <span class="fmrc-load-edge" style="--layer:-1"></span>
            <span class="fmrc-load-edge" style="--layer:0"></span>
            <span class="fmrc-load-edge" style="--layer:1"></span>
            <span class="fmrc-load-edge" style="--layer:2"></span>
            <span class="fmrc-load-edge" style="--layer:3"></span>
            <span class="fmrc-load-edge" style="--layer:4"></span>
            <span class="fmrc-load-edge" style="--layer:5"></span>
            <span class="fmrc-load-edge" style="--layer:6"></span>
            <span class="fmrc-load-edge" style="--layer:7"></span>
            <span class="fmrc-load-face"><span class="fmrc-load-logo-bed"><span class="fmrc-load-logo"></span></span></span>
          </span>
        </span>
      </div>
      <p class="fmrc-load-brand">UCN&ndash;FMRC</p>
      <p class="fmrc-load-name">Fabrication &amp; Manufacturing<br>Research Center</p>
      <p class="fmrc-load-caption">Preparing your experience</p>
      <div class="fmrc-load-rail" aria-hidden="true"><span></span></div>
      <p class="fmrc-load-manual">Not moving? <a href="home-page/main">Continue to UCN FabManLab</a></p>
    </main>
</body>
</html>
